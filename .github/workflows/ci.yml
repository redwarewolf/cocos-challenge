name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # eslint directo (no "npm run lint", que corre --fix): en CI queremos que
      # falle si hay algo para corregir, no que lo corrija en silencio.
      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts" --max-warnings=0

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests + coverage
        run: npm run test:cov

      # test:e2e levanta su propio Postgres descartable con Testcontainers (no
      # necesita ningún secret: DATABASE_URL se resuelve dinámicamente contra ese
      # container, nunca contra la base real de Cocos). Docker ya viene disponible
      # en los runners de GitHub Actions.
      - name: E2E tests (Testcontainers)
        run: npm run test:e2e

      - name: Build
        run: npm run build
